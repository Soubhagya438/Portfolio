<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soubhagya Amrutansu Swain — Full-Stack Developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f6ff;--panel:#fff;--ink:#17122b;--mute:#5e577e;--line:#e0dbf3;--acc:#d92d6b;--acc2:#6a45f0;--on:#fff;--soft:#efeaff;--cb:#0f0f0f;--cf:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0b18;--panel:#17132b;--ink:#f3f0ff;--mute:#a59ec6;--line:#2c2550;--acc:#ff5c98;--acc2:#9a82ff;--on:#0d0b18;--soft:#211a40;--cb:#fafafa;--cf:#0f0f0f}}
:root[data-theme="dark"]{--bg:#0d0b18;--panel:#17132b;--ink:#f3f0ff;--mute:#a59ec6;--line:#2c2550;--acc:#ff5c98;--acc2:#9a82ff;--on:#0d0b18;--soft:#211a40;--cb:#fafafa;--cf:#0f0f0f}
html{scroll-behavior:smooth;scroll-padding-top:76px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 Manrope,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:Sora,Manrope,system-ui,sans-serif;margin:0;line-height:1.08;letter-spacing:-.02em}
a{color:inherit}
:focus-visible{outline:3px solid var(--acc2);outline-offset:3px}
.w{max-width:1080px;margin:0 auto;padding:0 22px}
.prog{position:fixed;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--acc),var(--acc2));transform-origin:0 50%;z-index:99}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header .w{display:flex;justify-content:space-between;align-items:center;height:60px;gap:16px}
.logo{font:800 20px Sora,sans-serif;text-decoration:none;white-space:nowrap}
nav{display:flex;gap:22px;overflow-x:auto}nav a{text-decoration:none;color:var(--mute);font-size:15px;white-space:nowrap}nav a:hover{color:var(--acc)}
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:44px;align-items:center;padding:72px 0 56px}
h1{font-size:clamp(40px,7vw,84px);font-weight:800;display:flex;flex-wrap:wrap;gap:0 .28em}
.wd{display:inline-flex;overflow:hidden;padding-bottom:.08em}
.ch{display:inline-block}
.role{font:600 clamp(18px,2.6vw,26px) Sora,sans-serif;color:var(--acc);margin:20px 0 14px;min-height:1.5em;overflow:hidden}
.role span{display:inline-block}
.lead{color:var(--mute);font-size:18px;max-width:30em;margin:0 0 28px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;text-decoration:none;font:700 15px Sora,sans-serif;padding:13px 26px;border-radius:99px;background:var(--acc);color:var(--on);border:1.5px solid var(--acc);cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.soon{background:transparent;color:var(--mute);border-color:var(--line);cursor:not-allowed}
.pic{position:relative;justify-self:center;width:min(310px,100%)}
.pic img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:50% 15%;border-radius:32px;border:1px solid var(--line);box-shadow:14px 14px 0 var(--acc2)}
.chip.fl{position:absolute;background:var(--panel);border:1px solid var(--line);color:var(--acc);font:700 13px Sora,sans-serif;padding:4px 14px;border-radius:99px;box-shadow:0 8px 20px -10px rgba(40,20,90,.4)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--line)}
.stat{padding:34px 24px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0;padding-left:0}
.stat b{display:block;font:800 clamp(40px,6vw,68px)/1 Sora,sans-serif;letter-spacing:-.03em;background:linear-gradient(120deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px}
.stat span{display:block;color:var(--mute);font-size:15px;max-width:12em}
section{padding-top:88px}
h2{font-size:clamp(30px,4.4vw,46px);font-weight:800;margin-bottom:28px}
.tabs{display:inline-flex;gap:4px;padding:5px;background:var(--soft);border-radius:99px;margin-bottom:28px}
.tab{position:relative;border:0;background:none;font:700 14px Sora,sans-serif;color:var(--mute);padding:9px 20px;border-radius:99px;cursor:pointer}
.tab[aria-selected=true]{color:var(--on)}
.pill{position:absolute;inset:0;background:var(--acc);border-radius:99px}
.tl{position:relative}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.card{background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:22px;padding:26px;cursor:pointer;display:flex;flex-direction:column}
.kind{align-self:flex-start;font:700 12px Sora,sans-serif;color:var(--c);border:1.5px solid var(--c);border-radius:99px;padding:1px 12px;margin-bottom:14px}
.card h3,.modal h3{font-size:25px;margin-bottom:4px}.sub{color:var(--mute);font-size:14px;margin:0 0 12px}.d{margin:0 0 16px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0 0 18px;list-style:none}
.chips li{font-size:13px;font-weight:700;padding:3px 13px;border-radius:99px;background:var(--soft)}
.more{margin-top:auto;font:700 14px Sora,sans-serif;color:var(--acc)}
.ov{position:fixed;inset:0;z-index:60;background:rgba(10,6,25,.6);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}
.modal{position:relative;width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:26px;padding:32px}
.x{position:absolute;right:16px;top:12px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-size:24px;line-height:1;cursor:pointer}
.hl{margin:0 0 20px;padding-left:20px}.hl li{margin-bottom:8px}
.tlw{position:relative;padding-left:40px}
.rail{position:absolute;left:8px;top:6px;bottom:6px;width:3px;background:var(--line);border-radius:3px}
.fill{height:100%;background:linear-gradient(var(--acc),var(--acc2));border-radius:3px;transform-origin:50% 0}
.job{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px 26px;margin-bottom:22px}
.dot{position:absolute;left:-40px;top:26px;width:19px;height:19px;border-radius:50%;background:var(--bg);border:4px solid var(--acc)}
.job h3{font-size:21px}.job .c{color:var(--acc);font-weight:700;margin:2px 0}.job .dt{color:var(--mute);font-size:14px;margin:0 0 8px}
.job ul{margin:0;padding-left:18px;color:var(--mute)}
.sk{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.sg{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px}
.sg h3{font-size:17px;margin-bottom:14px}.sg .chips{margin:0}
.edu{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.ed{height:100%;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:20px;padding:22px 24px}.ed b{display:block;font:700 18px Sora,sans-serif;margin-bottom:6px}.ed span{color:var(--mute);font-size:14px}
.cbox{position:relative;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;padding:clamp(28px,5vw,64px);border-radius:32px;background:var(--cb);color:var(--cf)}
.cl,.cf{position:relative}
.cbox h2{font-size:clamp(30px,4.2vw,50px);margin-bottom:16px}
.cl>p{color:color-mix(in srgb,var(--cf) 90%,transparent);margin:0 0 28px;max-width:26em}
.cm{display:grid;gap:12px}
.cb{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:700 16px Manrope,sans-serif;color:var(--cf);text-decoration:none;background:color-mix(in srgb,var(--cf) 14%,transparent);border:1px solid color-mix(in srgb,var(--cf) 30%,transparent);border-radius:16px;padding:14px 16px;cursor:pointer}
.ci{flex:none;width:40px;height:40px;border-radius:12px;background:var(--cf);color:var(--cb);display:grid;place-items:center;font:800 18px Sora,sans-serif}
.ct{flex:1;min-width:0;overflow-wrap:anywhere}.ct small{display:block;font-weight:500;opacity:.8;font-size:12px}
.cc{flex:none;font:700 13px Sora,sans-serif;background:color-mix(in srgb,var(--cf) 16%,transparent);padding:4px 12px;border-radius:99px}
.cf{display:grid;gap:14px}
.fld{position:relative;padding-top:20px}
.fld input,.fld textarea{width:100%;background:transparent;border:0;border-bottom:2px solid color-mix(in srgb,var(--cf) 50%,transparent);border-radius:0;color:var(--cf);padding:10px 0;font:500 17px Manrope,sans-serif;box-shadow:none;transition:border-color .2s}
.fld textarea{min-height:110px;resize:vertical}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--cf);box-shadow:none}
.fld input:focus-visible,.fld textarea:focus-visible{outline:2px solid var(--cf);outline-offset:6px;border-radius:4px}
.fld label{position:absolute;left:0;top:32px;font-weight:500;color:color-mix(in srgb,var(--cf) 88%,transparent);pointer-events:none;transition:all .2s;transform-origin:left}
.fld input:focus+label,.fld input:not(:placeholder-shown)+label,.fld textarea:focus+label,.fld textarea:not(:placeholder-shown)+label{top:0;font-size:12.5px;font-weight:700}
.hp{position:absolute;left:-9999px}
.send{justify-self:start;margin-top:8px;font:800 16px Sora,sans-serif;color:var(--cb);background:var(--cf);border:0;border-radius:99px;padding:14px 30px;cursor:pointer}
.stw{min-height:1.5em}.st{margin:0;font-size:14px;font-weight:700;color:var(--cf)}
footer{margin-top:88px;border-top:1px solid var(--line);padding:26px 0;color:var(--mute);font-size:14px}
@media(max-width:820px){
.hero{grid-template-columns:1fr;gap:30px;padding:40px 0}.pic{width:230px;justify-self:start;order:-1}
.stats{grid-template-columns:repeat(2,1fr)}.stat{padding:24px 16px}.stat:nth-child(odd){border-left:0;padding-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}.grid,.sk,.edu{grid-template-columns:1fr}.cbox{grid-template-columns:1fr;gap:34px}
.tlw{padding-left:34px}.dot{left:-34px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
